<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; connect-src https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: https://*.gstatic.com https://*.googleusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
    <title>The Dangling Conversation - Google Sign-In</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js" defer></script>
    <script src="auth.js" defer></script>
    <script id="google-gis-client"
            src="https://accounts.google.com/gsi/client" defer></script>
  </head>
  <body>
    <main class="auth-card">
      <h1>The Dangling Conversation</h1>
      <p class="intro">Continue with Google</p>
      <div id="google-button-container" aria-live="polite"></div>
      <p id="status" role="status"></p>
      <p class="cancel-note">You can close this window to cancel.</p>
    </main>
  </body>
</html>
